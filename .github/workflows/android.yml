name: Android APK

# Builds the signed SHAAH Android APK and publishes it as release v<versionName> (one APK each),
# so it can be downloaded straight onto the phone or tracked by Obtainium. Runs on demand or when source/android changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHAAH_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta el secreto SHAAH_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shaah-upload.jks"
      - name: Build
        working-directory: source/android/project
        env:
          SHAAH_KEYSTORE: ${{ runner.temp }}/shaah-upload.jks
          SHAAH_KEYSTORE_PASSWORD: ${{ secrets.SHAAH_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        run: |
          APK=source/android/project/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i sha-256
          VERSION=$(grep -m1 versionName source/android/project/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          cp "$APK" "SHAAH-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish as release v<version>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per version with a single APK, so updaters such as Obtainium detect new versions by tag.
          TAG="v$VERSION"
          NOTES="SHAAH Android $VERSION · rama ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "SHAAH-$VERSION.apk" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "SHAAH-$VERSION.apk" --title "SHAAH Android $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi

<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html{background:#07070f;height:100%;}
html,body{height:100%;background:#07070f;color:#ececf2;font-family:'DM Sans','DM Mono',system-ui,sans-serif;
  overflow:hidden;position:fixed;width:100%;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5;}
input,textarea{-webkit-user-select:text;user-select:text;}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:smooth;}
#scroll::-webkit-scrollbar{display:none;}
/* El hueco que cada vista reserva abajo es calc(68px + safe-area): el dock mide
   66 px reales (46 de boton + 18 de padding + borde), no 58. Con 58 el boton
   RESET DAY quedaba 8 px por debajo de la barra. Si cambia el alto del dock,
   cambiar tambien ese 68. */
#nav{transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .25s ease;position:fixed;bottom:0;left:0;right:0;background:rgba(7,7,15,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #111120;display:flex;padding-bottom:max(calc(env(safe-area-inset-bottom) - 24px),4px);z-index:999;}
.nav-btn{flex:1;min-height:46px;padding:9px 4px 9px;background:none;border:none;font-family:inherit;font-size:13.5px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s;border-top:2px solid transparent;color:#adadbf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.nav-btn:active{opacity:.6;}
.nav-btn[hidden]{display:none!important;}   /* display:flex de arriba gana al hidden por defecto */
#nav.tucked{transform:translateY(115%);opacity:0;pointer-events:none;}
/* ── TODAY section order — day vs night ────────────────────── */
.today>*{order:70;}
.today .t-head{order:1;}
/* Mobile Today order: score first, routines before habits, day log/note after habits. */
.today .t-streak{order:5;}
.today .t-score-hero{order:10;}
.today .t-rout{order:20;}
.today .t-lvl1{order:30;}
.today .t-lvl2{order:40;}
.today .t-lvl3{order:50;}
.today .t-note{order:60;}
.today .t-reset{order:70;}
/* Night layout is mobile-only by design: on desktop the two-column
   flow always uses day order (CSS columns ignore `order` anyway). */
@media(max-width:879px){
  .today.night .t-rout{order:20;}
  .today.night .t-note{order:60;}

  /* ── Densidad en movil ──────────────────────────────────────────────
     La tira sticky (#tb-score) ya repite letra, %, barra y siguiente
     movimiento; el anillo de 168 px MAS la tarjeta de nota apilados eran
     ~355 px de marcador antes del primer habito. En fila son ~150 px.
     `row wrap` (no columna) para que el orden de `order` siga mandando:
     todo lo demas es 100% y cae en su propia linea. */
  .today{flex-flow:row wrap !important;justify-content:center;
         align-items:flex-start !important;column-gap:12px !important;row-gap:12px !important;}
  .today>*{flex:0 0 100%;}
  .today .t-ring{flex:0 0 auto;align-self:center;margin:0 !important;}
  .today .t-grade{flex:1 1 150px;min-width:0;align-self:center;width:auto !important;max-width:none !important;
                  padding:12px 13px !important;}
  /* La letra grande la repiten el anillo (el %) y la tira sticky: dentro de una
     tarjeta de 240 px solo robaba sitio a CORE/HABITS/BONUS. */
  .today .t-grade>div:first-child{display:none;}
  .today .t-reset{flex:0 0 auto;}
  /* El aire de dentro: filas, cabeceras y tarjetas de rutina */
  .today .row{padding:10px 14px;}
  .today .sec{margin-bottom:9px;}
  .today .t-rout>div:not(.sec){padding:12px !important;margin-bottom:8px !important;}
}

/* ── Desktop: two columns instead of one narrow strip ───────── */
/* ── Active-routine indicator: chips | slim | circle ────────── */
#resume{position:fixed;left:12px;right:12px;z-index:1500;display:none;
  bottom:calc(58px + max(calc(env(safe-area-inset-bottom) - 24px),4px));}
#resume.on{display:block;animation:fadeUp .3s ease;}
.rz-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rz-dot.live{animation:rzPulse 1.6s ease-in-out infinite;}
@keyframes rzPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
.rz-ct{font-family:'Bebas Neue';line-height:1;flex-shrink:0;}
.rz-x{width:26px;height:26px;border-radius:50%;background:none;border:1px solid #2a2a40;
  color:#9a9ab4;font-size:13px;line-height:1;flex-shrink:0;cursor:pointer;font-family:inherit;padding:0;}

/* 5 · chips — one row regardless of how many run */
.rz-row{display:flex;gap:7px;}
.rz-chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:13px;
  background:rgba(16,16,28,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid #26263c;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;
  transition:transform .12s;}
.rz-chip:active{transform:scale(.97);}
.rz-cmid{min-width:0;flex:1;display:flex;flex-direction:column;}
.rz-chip .rz-ct{font-size:19px;}
.rz-cn{font-size:11px;color:#9a9ab2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

/* 2 · slim bar */
.rz-slim{display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:99px;margin-top:7px;
  background:rgba(16,16,28,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid #26263c;box-shadow:0 8px 22px rgba(0,0,0,.5);cursor:pointer;transition:transform .12s;}
.rz-slim:active{transform:scale(.985);}
.rz-lbl{flex:1;min-width:0;font-size:12.5px;color:#c0c0cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rz-slim .rz-ct{font-size:19px;}

/* 3 · floating circle */
#resume.pill-circle{left:auto;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.rz-circle{position:relative;width:62px;height:62px;border-radius:50%;cursor:pointer;
  background:rgba(16,16,28,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid #26263c;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.6);transition:transform .12s;}
.rz-circle:active{transform:scale(.94);}
.rz-circle .rz-ct{font-size:19px;}
.rz-ci{font-size:12px;opacity:.8;margin-top:1px;}
.rz-cdot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;}

/* ── Collapsible levels ── */
.lvl-h{user-select:none;}
.lvl-h:active{opacity:.6;}
.lvl-ar{display:inline-block;transition:transform .22s cubic-bezier(.4,0,.2,1);font-size:13px;color:#7e7e97;}
.lvl-ar.cl{transform:rotate(-90deg);}
.lvl-b{overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s;max-height:1600px;opacity:1;}
.lvl-b.cl{max-height:0;opacity:0;pointer-events:none;}

/* ── Settings: card sections, same language as Stats ────────── */
.settings-body{display:flex;flex-direction:column;gap:14px;}
.st-card{background:#0b0b14;border:1px solid #16162a;border-radius:16px;overflow:hidden;}
.st-head{display:flex;align-items:center;gap:9px;padding:14px 16px;cursor:pointer;user-select:none;}
.st-head:active{opacity:.65;}
.st-title{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;}
.st-body{padding:0 16px 16px;}
/* ══ Desktop: use the width that's actually available ═════════ */
@media(min-width:880px){
  #scroll>.fade-up{max-width:none;padding-left:26px;padding-right:26px;}

  /* Settings — explicit 3-column grid.
     CSS columns balanced by height and left the third column empty,
     so each card gets its own column deliberately. */
  #scroll .settings-body{
    display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;align-items:start;align-content:start;columns:auto;
  }
  #scroll .settings-body .st-card{margin:0;width:auto;display:block;}

  /* ── TODAY — Option 4: summary strip on top, full-width checklist ──
     Every block gets an explicit grid row + column, so placement is
     deterministic and `order` (night mode) can't shift anything here. */
  /* El sobrante vertical lo reparten los HUECOS entre filas, no el tamano de
     nada: escalar (zoom) inflaba cajas y bordes; esto solo separa los bloques.
     #scroll pasa a columna flexible para que .today pueda ocupar el alto libre. */
  #scroll{display:flex;flex-direction:column;}
  #scroll>*{flex-shrink:0;}
  #scroll>.today{flex:1 0 auto;align-content:space-between;}
  #scroll .today{
    display:grid !important;
    grid-template-columns:repeat(12,minmax(0,1fr));
    /* !important: el contenedor lleva `gap:18px` en linea y ganaba al grid,
       asi que este row-gap llevaba tiempo sin aplicarse. */
    column-gap:18px !important;row-gap:14px !important;
    /* idem: `align-items:center` en linea centraba cada tarjeta en su fila, y las
       cortas quedaban descolgadas respecto a las largas. */
    /* stretch: dentro de una fila todas las tarjetas miden lo mismo — es lo que
       hace que DAY NOTE y los niveles se vean como un juego. El anillo y la
       tarjeta de nota llevan `align-self:center` propio y no se ven afectados. */
    align-items:stretch !important;grid-auto-rows:min-content;
  }
  #scroll .today>*{width:auto !important;max-width:none !important;margin:0 !important;}

  #scroll .today .t-head  {grid-row:1;grid-column:1 / -1;margin-bottom:2px !important;}
  /* main view has no .t-head (the date lives in the top bar), so the
     strip starts on row 1 there and row 1 simply collapses when unused */

  /* summary strip: ring · grade · streak on one line */
  #scroll .today .t-ring  {grid-row:2;grid-column:1 / span 2;justify-self:center;align-self:center;
                           zoom:.95;margin:0 !important;}
  /* Desktop Today: keep the score ring + LOG button together on the left,
     vertically stacked, while the summary bar sits beside them on the same row. */
  #scroll .today .t-score-hero {
    grid-row:2 !important;grid-column:1 / span 2 !important;
    width:auto !important;max-width:none !important;
    justify-self:center;align-self:center;
    margin:0 !important;
  }
  #scroll .today .t-score-stack {
    min-width:168px;gap:6px !important;
  }
  #scroll .today .today-log-start {
    margin-top:-1px !important;
  }
  #scroll .today .t-grade {grid-row:2;grid-column:3 / -1;align-self:center;}

  /* the three levels side by side, en orden 1·2·3, ahora ANTES de rutinas —
     pedido de David el 15/09. Columnas explicitas para que el orden no
     dependa del DOM. */
  #scroll .today .t-lvl1  {grid-row:3;grid-column:1 / span 4;}
  #scroll .today .t-lvl2  {grid-row:3;grid-column:5 / span 4;}
  #scroll .today .t-lvl3  {grid-row:3;grid-column:9 / span 4;}

  /* La nota se queda junto a las rutinas, una fila mas abajo. Lo que se
     iguala son las DIMENSIONES: misma altura que la caja vecina gracias a
     `stretch`. */
  #scroll .today .t-rout  {grid-row:4;grid-column:1 / span 8;}
  #scroll .today .t-note  {grid-row:4;grid-column:9 / span 4;}

  #scroll .today .t-reset {grid-row:5;grid-column:1 / -1;justify-self:center;align-self:center;max-width:280px;}
  /* Estirar los tres niveles al mas alto dejaba a LVL 3 (un habito) con ~250 px
     de caja vacia y a LVL 2 con ~180. Cada uno mide lo suyo; el sobrante lo
     reparte `align-content:space-between` entre las filas, que es aire, no
     hueco muerto dentro de una tarjeta. */
  #scroll .today .t-lvl{align-self:start;}
  /* Las dos tarjetas de rutina se estiran hasta el alto de la fila en vez de
     dejar el fondo del bloque en negro. */
  #scroll .today .t-rout{align-items:stretch;}
  #scroll .today .t-rout>div:not(.sec){display:flex;}
  #scroll .today .t-note{display:flex;flex-direction:column;}
  #scroll .today .t-note .notecard{flex:1;display:flex;}
  #scroll .today .t-note textarea{flex:1;}

  /* HISTORY — el texto de dentro estaba diminuto en una pantalla ancha.
     Sube el contenido, NO el alto de la caja: el ring y los paddings no se tocan,
     y `h-day`/`h-lvl` caben de sobra en el alto que ya tenian. */
  /* TODAY y SOCIAL: MISMO criterio que HISTORY — sube lo que se lee, no la caja.
     El zoom que escalaba todo por igual quedaba inflado; esto solo toca texto.
     Los estilos en linea ganan a la hoja, de ahi el !important en cada regla. */
  #scroll .today .sec,
  #scroll .soc .sec        {font-size:16px !important;}
  #scroll .today .row span {font-size:19px !important;}
  #scroll .today .lvl-n    {font-size:14px !important;}
  #scroll .today .t-grade span{font-size:16.5px !important;}
  #scroll .today .t-note textarea{font-size:17px !important;}
  #scroll .today .r-lab    {font-size:19px !important;}
  #scroll .today .r-sub    {font-size:16px !important;}
  #scroll .today .r-step   {font-size:16px !important;}
  #scroll .today .r-btn    {font-size:16px !important;}
  #scroll .cb-tit          {font-size:21px !important;}
  #scroll .cb-sub          {font-size:17px !important;}
  #scroll .cb-row          {font-size:19px !important;}
  #scroll .cb-pill         {font-size:17px !important;padding:8px 16px !important;}
  #scroll .w-name          {font-size:19px !important;}
  #scroll .w-when          {font-size:16.5px !important;}
  #scroll .w-due           {font-size:16px !important;}
  #scroll .sd-day          {font-size:19px !important;}
  #scroll .sd-pts          {font-size:16px !important;}

  #scroll .htab   {font-size:16px !important;padding:9px 20px !important;}
  #scroll .h-day  {font-size:19px !important;letter-spacing:.05em !important;}
  #scroll .h-today{font-size:15px !important;}
  #scroll .h-lvl  {font-size:17px !important;}
  #scroll .h-num  {font-size:19px !important;}
  #scroll .h-grade{font-size:38px !important;}
  #scroll .h-edit {font-size:16px !important;padding:7px 15px !important;}

  #scroll .today .t-lvl,
  #scroll .today .t-note,
  #scroll .today .t-rout{background:#0b0b14;border:1px solid #16162a;border-radius:16px;padding:15px 20px;}
  #scroll .today .t-note textarea{min-height:96px;padding:13px 16px 13px 18px;}
  /* El aire de dentro de las tarjetas, no el tamaño de letra */
  #scroll .today .t-lvl .row{padding-top:13px;padding-bottom:13px;}
  #scroll .today .sec{margin-bottom:11px;}
  #scroll .today .t-grade{padding:15px 20px;}
  #scroll .today .t-reset{padding-top:7px;padding-bottom:7px;}
  /* two routines side by side instead of stacked */
  #scroll .today .t-rout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  #scroll .today .t-rout>.sec{grid-column:1 / -1;margin-bottom:0;}

  /* Desktop has room — nudge everything up a step */
  #scroll .today{font-size:16px;}
  #scroll .today .sec{font-size:13px;}
  #scroll .today .row span{font-size:17.5px !important;}
  #scroll .today .t-note textarea{font-size:14.5px;min-height:88px;}

  /* Settings — larger text and symbols to use the width */
  #scroll .settings-body{font-size:16px;}
  #scroll .settings-body .st-title{font-size:14px;letter-spacing:.09em;}
  #scroll .settings-body .st-head{padding:16px 18px;}
  #scroll .settings-body .st-body{padding:0 18px 18px;}
  #scroll .settings-body .sec{font-size:13.5px;}
  #scroll .settings-body input,
  #scroll .settings-body select,
  #scroll .settings-body button{font-size:16px !important;}
  #scroll .settings-body span[style*="width:22px"]{font-size:20px !important;width:26px !important;}
  #scroll .settings-body .ord{width:34px;height:24px;font-size:11px;}
}
.st-div{height:1px;background:#16162a;margin:16px 0;}
.ord{width:34px;height:26px;display:flex;align-items:center;justify-content:center;
  background:#151524;border:1px solid #23233a;color:#9a9ab4;border-radius:6px;
  font-size:10px;line-height:1;cursor:pointer;font-family:inherit;padding:0;
  transition:background .15s,color .15s,transform .1s;}
.ord:active{transform:scale(.88);background:#20203a;color:#e2e2e2;}
@media(hover:hover){.ord:hover{background:#1d1d33;color:#d0d0da;}}
.nav-btn.active{color:#e2e2e2;border-top-color:#e2e2e2;}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:13px;cursor:pointer;user-select:none;transition:all 0.18s;border:1px solid transparent;position:relative;overflow:hidden;}
.row.on{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.07);}
.row:active{transform:scale(0.975);}
.sec{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#a0a0b6;margin-bottom:13px;padding-left:2px;font-weight:500;}
.card{background:#0c0c18;border:1px solid #111120;border-radius:16px;padding:18px;}
.htab{padding:7px 16px;background:none;border:1px solid #161626;color:#a4a4ba;font-family:inherit;font-size:14.5px;letter-spacing:0.1em;border-radius:99px;cursor:pointer;transition:all 0.2s;}
.htab.active{border-color:#3a3a5a;color:#e2e2e2;background:#161626;}
.edit-btn{background:none;border:1px solid #1e1e2e;color:#aaaabe;font-size:14.5px;padding:3px 10px;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:0.06em;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}55%{transform:scale(1.5) rotate(6deg);opacity:1}100%{transform:scale(0.9) rotate(0);opacity:0}}
.fade-up{animation:fadeUp 0.35s ease;}
.qtile{transition:transform .12s ease,background .2s,border-color .2s;}
.qtile:active{transform:scale(.96);}
.notecard{position:relative;background:linear-gradient(180deg,#0d0d1a 0%,#0b0b16 100%);
  border:1px solid #161626;border-radius:14px;overflow:hidden;transition:border-color .25s;}
.notecard:focus-within{border-color:#2e2e4a;}
.notecard.filled{border-color:#1d2a22;}
.notebar{position:absolute;left:0;top:0;bottom:0;width:3px;background:#1e1e33;transition:background .25s;}
.notecard.filled .notebar{background:linear-gradient(180deg,#4ade80,#4ade8033);}
.notecard:focus-within .notebar{background:linear-gradient(180deg,#60a5fa,#60a5fa33);}
.notecard textarea::placeholder{color:#aaaabe;}

/* ── Top bar: sits in the scroll flow, scrolls away with content ── */
#topbar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 6px;}
/* ── STATS: rejilla habito x dia ── */
.cg-row{display:grid;grid-template-columns:minmax(104px,170px) 1fr 46px 42px;align-items:center;gap:10px;}
.cg-lab{font-size:14.5px;color:#c0c0cd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── SOCIAL: barra de dia ── */
.sd-bar{display:flex;align-items:center;gap:9px;}

  font-size:12px;letter-spacing:.1em;padding:5px 10px;border-radius:8px;cursor:pointer;}
/* ── Tira de marcador, 44 px, pegada arriba mientras marcas ── */
#tb-score{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:11px;
  height:44px;padding:0 15px;background:rgba(7,7,15,.94);

.ts-bar>i{display:block;height:100%;border-radius:99px;transition:width .3s cubic-bezier(.4,0,.2,1);}

#gear{width:34px;height:34px;display:flex;align-items:center;justify-content:center;

  font-family:inherit;transition:transform .12s,color .2s,border-color .2s;}

@media(hover:hover){#gear:hover{color:#e2e2e2;border-color:#3a3a55;}}
/* ── First-run tour ── */
#tour{position:fixed;inset:0;z-index:2000;display:none;}

.tour-scrim{position:absolute;inset:0;background:rgba(4,4,10,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.tour-card{position:relative;width:100%;max-width:460px;margin:0 12px calc(env(safe-area-inset-bottom) + 16px);

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SHAAH"/>
<meta name="theme-color" content="#07070f"/>
<title>SHAAH</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#07070f;color:#e2e2e2;font-family:'DM Mono',monospace;overflow:hidden;}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
#scroll::-webkit-scrollbar{display:none;}
#nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,7,15,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #111120;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:999;}
.nav-btn{flex:1;padding:8px 4px 8px;background:none;border:none;font-family:inherit;font-size:7px;letter-spacing:0.22em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;border-top:2px solid transparent;color:#666;display:flex;flex-direction:column;align-items:center;gap:4px;}
.nav-btn.active{color:#e2e2e2;border-top-color:#e2e2e2;}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:13px;cursor:pointer;user-select:none;transition:all 0.18s;border:1px solid transparent;position:relative;overflow:hidden;}
.row.on{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.07);}
.row:active{transform:scale(0.975);}
.sec{font-size:8px;letter-spacing:0.28em;text-transform:uppercase;color:#666;margin-bottom:12px;padding-left:2px;}
.card{background:#0c0c18;border:1px solid #111120;border-radius:16px;padding:18px;}
.htab{padding:7px 16px;background:none;border:1px solid #161626;color:#333;font-family:inherit;font-size:9px;letter-spacing:0.15em;border-radius:99px;cursor:pointer;transition:all 0.2s;}
.htab.active{border-color:#3a3a5a;color:#e2e2e2;background:#161626;}
.edit-btn{background:none;border:1px solid #1e1e2e;color:#3a3a4a;font-size:9px;padding:3px 10px;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:0.06em;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}55%{transform:scale(1.5) rotate(6deg);opacity:1}100%{transform:scale(0.9) rotate(0);opacity:0}}
.fade-up{animation:fadeUp 0.35s ease;}
</style>
</head>
<body>
<div id="app">
  <div id="sync-status" onclick="if(USER&&confirm('¿Cerrar sesión?'))signOut()" style="cursor:pointer;position:fixed;top:env(safe-area-inset-top);right:12px;font-size:9px;font-family:monospace;z-index:1000;padding:3px 8px;border-radius:99px;background:#0c0c18;border:1px solid #1e1e2e;color:#666;letter-spacing:0.1em">SYNC</div>
  <div id="scroll"></div>
  <nav id="nav">
    <button class="nav-btn active" data-tab="home" onclick="setTab('home')"><span style="font-size:17px">◎</span>HOME</button>
    <button class="nav-btn" data-tab="today" onclick="setTab('today')"><span style="font-size:17px">◉</span>HOY</button>
    <button class="nav-btn" data-tab="stats" onclick="setTab('stats')"><span style="font-size:17px">◇</span>STATS</button>
    <button class="nav-btn" data-tab="history" onclick="setTab('history')"><span style="font-size:17px">◈</span>HISTORIAL</button>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  SHAAH — Supabase Auth + Realtime data layer
//  Single source of truth: Supabase. localStorage = cache only.
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL="https://llpyxktcfubhmthqujpa.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscHl4a3RjZnViaG10aHF1anBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTQyMzEsImV4cCI6MjA5NTM5MDIzMX0.4dutcaJzjhuR9IQRlpBetGgLalaSZCiEDdl3oSI_f2A";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let USER = null;
let _state = {};        // { "YYYY-MM-DD": { checks:{}, social:{} } }
let _live = false;

const get=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const todayKey=()=>new Date().toISOString().slice(0,10);

const cacheKey=()=>`shaah_cache_${USER?USER.id:"anon"}`;
const loadCache=()=>{_state=get(cacheKey())||{};};
const saveCache=()=>set(cacheKey(),_state);

function statusEl(){return document.getElementById('sync-status');}
function setStatus(text,color){const e=statusEl();if(e){e.textContent=text;e.style.color=color;}}

// ── Data accessors — all derive from _state ────────────────
const blankSocial=()=>({flirt:false,strangers:false,friends:false});
const getChecked=k=>(_state[k]&&_state[k].checks)||{};
const getSocial=k=>(_state[k]&&_state[k].social)||blankSocial();

function calcScore(key){
  const ch=getChecked(key),soc=getSocial(key);
  const activeSubs=Object.values(soc).filter(Boolean).length;
  const socialPts=ch.social?(activeSubs>0?Math.round((activeSubs/3)*18):18):0;
  const l1=LVL1.reduce((a,i)=>a+(ch[i.id]?i.pts:0),0);
  const l2=LVL2.reduce((a,i)=>a+(ch[i.id]?i.pts:0),0);
  const l3=socialPts+(ch.nosmoke?6:0)+(ch.pomodoro?6:0);
  return{score:l1+l2+l3,l1,l2,l3,done:Object.values(ch).filter(Boolean).length};
}

// History is DERIVED, never stored separately — cannot drift from checks
function getHistory(){
  const h={};
  for(const date of Object.keys(_state)){
    const{score,l1,l2,l3,done}=calcScore(date);
    if(score>0)h[date]={score,grade:GRADE(score).l,l1,l2,l3,done};
  }
  return h;
}

// ── Writes — optimistic local, then push to server ─────────
const _pending={};
function persistDay(key){
  saveCache();
  if(!USER)return;
  clearTimeout(_pending[key]);
  _pending[key]=setTimeout(async()=>{
    const ch=getChecked(key),soc=getSocial(key);
    const{score,l1,l2,l3,done}=calcScore(key);
    const anything=Object.values(ch).some(Boolean);
    try{
      if(!anything){
        await sb.from('day_logs').delete().eq('user_id',USER.id).eq('date',key);
        delete _state[key];saveCache();
      }else{
        await sb.from('day_logs').upsert({
          user_id:USER.id,date:key,
          data:{score,grade:GRADE(score).l,l1,l2,l3,done,_checks:ch,_social:soc}
        },{onConflict:'user_id,date'});
      }
    }catch(e){}
  },250);
}

function setChecked(k,v){if(!_state[k])_state[k]={checks:{},social:blankSocial()};_state[k].checks=v;}
function setSocial(k,v){if(!_state[k])_state[k]={checks:{},social:blankSocial()};_state[k].social=v;}

// ── Server load + realtime ─────────────────────────────────
function rowToState(row){
  const d=row.data||{};
  _state[row.date]={checks:d._checks||{},social:d._social||blankSocial()};
}

async function loadAll(){
  if(!USER)return;
  setStatus('SYNC…','#f59e0b');
  try{
    const{data,error}=await sb.from('day_logs').select('date,data').eq('user_id',USER.id);
    if(error)throw error;
    _state={};
    (data||[]).forEach(rowToState);
    saveCache();
    setStatus(_live?'LIVE':'✓','#4ade80');
  }catch(e){
    setStatus('OFFLINE','#ef4444');
  }
  render();
}

function subscribeRealtime(){
  if(!USER)return;
  sb.channel('shaah-'+USER.id)
    .on('postgres_changes',
      {event:'*',schema:'public',table:'day_logs',filter:`user_id=eq.${USER.id}`},
      payload=>{
        if(payload.eventType==='DELETE'){
          if(payload.old&&payload.old.date)delete _state[payload.old.date];
        }else if(payload.new){
          rowToState(payload.new);
        }
        saveCache();
        render();
        setStatus('LIVE','#4ade80');
      })
    .subscribe(s=>{
      _live=(s==='SUBSCRIBED');
      if(_live)setStatus('LIVE','#4ade80');
    });
}

// ── Auth ───────────────────────────────────────────────────
async function signIn(){
  await sb.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.href.split('#')[0]}
  });
}
async function signOut(){
  await sb.auth.signOut();
  _state={};USER=null;
  location.reload();
}

function renderLogin(){
  return`<div style="height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px">
    <div style="text-align:center">
      <div style="font-family:'Bebas Neue';font-size:56px;letter-spacing:0.3em;color:#e2e2e2;line-height:1">SHAAH</div>
      <div style="font-size:10px;letter-spacing:0.35em;color:#666;margin-top:8px">שעה · LA HORA</div>
    </div>
    <div style="font-size:12px;color:#666;text-align:center;max-width:280px;line-height:1.6">
      Inicia sesión para sincronizar tus hábitos en todos tus dispositivos.
    </div>
    <button onclick="signIn()" style="display:flex;align-items:center;gap:12px;background:#fff;color:#1a1a1a;border:none;font-family:inherit;font-size:13px;font-weight:500;padding:14px 26px;border-radius:12px;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.600v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.1H4.3v5.7C7.9 41 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.1c-.4-1.3-.7-2.7-.7-4.1s.2-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.4 2 24s.8 6.9 2.3 9.8l7.3-5.7z"/><path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.3 30 2 24 2 15.4 2 7.9 7 4.3 14.2l7.3 5.7c1.7-5.2 6.6-9.1 12.4-9.1z"/></svg>
      Continuar con Google
    </button>
  </div>`;
}

// ── Boot ───────────────────────────────────────────────────
async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  USER=session?session.user:null;
  if(USER){
    loadCache();          // instant paint from cache
    render();
    await loadAll();      // server is truth
    subscribeRealtime();
  }else{
    render();
  }
}

sb.auth.onAuthStateChange((event,session)=>{
  const wasUser=USER?USER.id:null;
  USER=session?session.user:null;
  if(USER&&USER.id!==wasUser){
    loadCache();render();
    loadAll().then(subscribeRealtime);
  }else if(!USER){
    _state={};render();
  }
});

function getStreak(){
  const h=getHistory();let s=0;
  for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);if(h[k]&&h[k].score>=60)s++;else if(i>0)break;}
  return s;
}
function getDays(n){
  const days=[],h=getHistory();
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    days.push({key,date:d,data:h[key]||null});
  }
  return days;
}
function getWeeks(){const d=getDays(28);return[0,1,2,3].map(w=>d.slice(w*7,w*7+7));}
function avgW(days){const f=days.filter(d=>d.data);return f.length?Math.round(f.reduce((a,d)=>a+d.data.score,0)/f.length):0;}

function ring(score,max,size,thick,col,glow){
  const r=(size-thick)/2-2,c=2*Math.PI*r,off=c-(Math.min(score,max)/max)*c,cx=size/2;
  return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg);filter:drop-shadow(0 0 ${size*.1}px ${glow});overflow:visible"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#0f0f1e" stroke-width="${thick}"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-width="${thick}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 0.6s cubic-bezier(0.34,1.56,0.64,1),stroke 0.4s"/></svg>`;
}
function chk(on,col,size=22){
  const br=Math.round(size*.32);
  return`<div style="width:${size}px;height:${size}px;border-radius:${br}px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;${on?`background:${col};box-shadow:0 0 10px ${col}66;border:none`:`border:1.5px solid #252535;background:transparent`}">${on?`<svg width="${size*.55}" height="${size*.55}" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="#080810" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</div>`;
}
function bar(pct,col,glow,h=6){
  return`<div style="height:${h}px;border-radius:99px;background:#0f0f1e;overflow:hidden"><div style="height:100%;border-radius:99px;width:${Math.min(pct,100)}%;background:${col};${pct>0?`box-shadow:0 0 8px ${glow}`:""}"></div></div>`;
}

let currentTab="home",routineId=null,routineQueue=[],routineCompleted={},timerSecs=0,timerRunning=false,timerInterval=null,socialExpanded=false,histTab="week",editDayKey=null;

function render(){
  const el=document.getElementById("scroll"),nav=document.getElementById("nav");
  if(!USER){el.innerHTML=renderLogin();nav.style.display="none";return;}
  if(routineId){el.innerHTML=renderRoutine();nav.style.display="none";return;}
  if(editDayKey){el.innerHTML=renderEditDay();nav.style.display="none";return;}
  nav.style.display="flex";
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  if(currentTab==="home")el.innerHTML=renderHome();
  else if(currentTab==="today")el.innerHTML=renderToday(todayKey());
  else if(currentTab==="stats")el.innerHTML=renderStats();
  else if(currentTab==="history")el.innerHTML=renderHistory();
}

function renderHome(){
  const tk=todayKey(),{score,l1,l2,l3}=calcScore(tk),ch=getChecked(tk),gr=GRADE(score),streak=getStreak(),now=new Date(),h=now.getHours();
  const greet=h<12?"Buenos días":h<18?"Buenas tardes":"Buenas noches";
  return`<div class="fade-up" style="padding:calc(28px + env(safe-area-inset-top)) 20px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px">
    <div>
      <div style="font-size:11px;color:#2a2a3a;letter-spacing:0.12em;margin-bottom:4px">${greet.toUpperCase()}</div>
      <div style="font-family:'Bebas Neue';font-size:36px;color:#e2e2e2;line-height:1">${now.toLocaleDateString("es-PA",{weekday:"long"}).toUpperCase()}</div>
      <div style="font-size:11px;color:#252535;margin-top:4px">${now.toLocaleDateString("es-PA",{day:"numeric",month:"long",year:"numeric"})}</div>
    </div>
    <div onclick="setTab('today')" style="background:${gr.bg};border:1px solid ${gr.c}1a;border-radius:18px;padding:20px;display:flex;align-items:center;gap:20px;cursor:pointer">
      <div style="position:relative;width:90px;height:90px;flex-shrink:0">
        ${ring(score,MAX,90,7,gr.c,gr.g)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-family:'Bebas Neue';font-size:26px;color:${gr.c};line-height:1">${score}</div>
          <div style="font-size:7px;color:${gr.c};opacity:0.6">%</div>
        </div>
      </div>
      <div style="flex:1">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
          <div style="font-family:'Bebas Neue';font-size:48px;color:${gr.c};line-height:1;text-shadow:0 0 24px ${gr.g}">${gr.l}</div>
          <div style="font-size:11px;color:${gr.c};opacity:0.7">${gr.n}</div>
        </div>
        ${bar((Math.min(score,MAX)/MAX)*100,gr.c,gr.g,4)}
        <div style="font-size:9px;color:#2a2a3a;margin-top:6px">TAP PARA DETALLES →</div>
      </div>
    </div>
    ${streak>0?`<div style="background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:10px"><span style="font-size:20px">🔥</span><div><div style="font-family:'Bebas Neue';font-size:22px;color:#FFD700;line-height:1">${streak} DÍA${streak!==1?"S":""}</div><div style="font-size:9px;color:#555;letter-spacing:0.1em">EN RACHA</div></div></div>`:""}
    <div>
      <div class="sec">RUTINAS DE HOY</div>
      ${LVL1.filter(i=>i.routine).map(item=>{
        const rt=ROUTINES[item.id],done=!!ch[item.id],totalMin=rt.steps.reduce((a,s)=>a+s.dur,0);
        return`<div style="background:${done?"rgba(255,255,255,0.03)":"#0d0d1a"};border:1px solid ${done?item.col+"22":"#111120"};border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:10px">
          <div style="width:46px;height:46px;border-radius:12px;background:${done?rt.col+"18":"#111120"};display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid ${done?rt.col+"33":"#161626"};flex-shrink:0">${rt.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;color:${done?"#555":"#e2e2e2"};font-weight:500;${done?"text-decoration:line-through":""}">${rt.label}</div>
            <div style="font-size:10px;color:#777;margin-top:3px">${rt.steps.length} pasos · ${totalMin} min</div>
            ${!done?`<div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">${rt.steps.slice(0,4).map(s=>`<span style="font-size:9px;color:#333;background:#111120;border:1px solid #161626;border-radius:6px;padding:2px 7px">${s.icon} ${s.dur}m</span>`).join("")}${rt.steps.length>4?`<span style="font-size:9px;color:#666">+${rt.steps.length-4} más</span>`:""}</div>`:""}
          </div>
          ${done?`<div onclick="toggleHabit('${item.id}','${tk}')" style="font-size:22px;cursor:pointer">✅</div>`:`
          <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
            <button onclick="startRoutine('${item.id}')" style="background:${rt.col};color:#080810;border:none;font-family:inherit;font-size:10px;letter-spacing:0.1em;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:0 0 16px ${rt.col}44;white-space:nowrap">▶ INICIAR</button>
            <button onclick="quickComplete('${item.id}')" style="background:none;border:1px solid ${rt.col}55;color:${rt.col};font-family:inherit;font-size:9px;letter-spacing:0.08em;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap">✓ LISTO</button>
          </div>`}
        </div>`;
      }).join("")}
    </div>
    <div>
      <div class="sec">HÁBITOS RÁPIDOS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[...LVL1.filter(i=>!i.routine),...LVL2].map(item=>`
        <div style="background:${ch[item.id]?item.col+"0a":"#0d0d1a"};border:1px solid ${ch[item.id]?item.col+"25":"#111120"};border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px">
          <span style="font-size:18px;opacity:${ch[item.id]?1:0.4}">${item.icon}</span>
          <div>
            <div style="font-size:11px;color:${ch[item.id]?"#e2e2e2":"#bbb"}">${item.label}</div>
            <div style="font-size:9px;color:${ch[item.id]?item.col+"88":"#666"};margin-top:2px">${ch[item.id]?"✓ DONE":item.pts+"%"}</div>
          </div>
        </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function renderToday(key,nested=false){
  const ch=getChecked(key),soc=getSocial(key),{score,l1,l2,l3,done}=calcScore(key),gr=GRADE(score),streak=getStreak();
  const activeSubs=Object.values(soc).filter(Boolean).length;
  const socialPts=ch.social?(activeSubs>0?Math.round((activeSubs/3)*18):18):0;
  const isToday=key===todayKey();
  return`<div class="fade-up" style="padding:${nested?"16px":`calc(22px + env(safe-area-inset-top))`} 16px ${nested?"32px":`calc(72px + env(safe-area-inset-bottom))`};display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="text-align:center;width:100%">
      <div style="font-family:'Bebas Neue';font-size:10px;letter-spacing:0.5em;color:#1e1e2e">DAY SCORE</div>
      <div style="font-size:9px;color:#888;letter-spacing:0.12em;margin-top:3px">${new Date(key+"T12:00:00").toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long"}).toUpperCase()}</div>
    </div>

      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">${rt.icon}</span>
        <div><div style="font-family:'Bebas Neue';font-size:18px;letter-spacing:0.15em;color:${rt.col}">${rt.label}</div><div style="font-size:9px;color:#333">${done}/${total} PASOS</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:80px">${bar(pct*100,rt.col,rt.col+"44",4)}</div>
        <button onclick="closeRoutine()" style="background:none;border:1px solid #1e1e2e;color:#444;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
      </div>
    </div>
    ${sl?`<div style="text-align:center;padding:10px 0 0"><span style="font-size:9px;letter-spacing:0.2em;color:${sl.col};border:1px solid ${sl.col}44;border-radius:99px;padding:3px 12px">${sl.label}</span></div>`:""}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 24px">
      <div style="position:relative;width:220px;height:220px">
        <svg width="220" height="220" style="transform:rotate(-90deg);filter:drop-shadow(0 0 20px ${col}55);overflow:visible">
          <circle cx="110" cy="110" r="${r}" fill="none" stroke="#111122" stroke-width="10"/>
          <circle cx="110" cy="110" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 0.5s linear"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <div style="font-size:40px;margin-bottom:4px">${current.icon}</div>
          <div style="font-family:'Bebas Neue';font-size:52px;line-height:1;color:${col};letter-spacing:-0.02em">${fmtTime}</div>
          <div style="font-size:9px;color:#666;letter-spacing:0.1em">${current.dur} MIN</div>
        </div>
      </div>
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:500;color:#e2e2e2">${current.label}</div>
        ${routineQueue.length>1?`<div style="font-size:11px;color:#2a2a3a;margin-top:6px">Siguiente: ${rt.steps[routineQueue[1]]?.icon} ${rt.steps[routineQueue[1]]?.label}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:20px;margin-top:8px">
        <button onclick="routineReset()" style="width:48px;height:48px;border-radius:50%;background:#111120;border:1px solid #1e1e2e;color:#666;font-size:18px;cursor:pointer">↺</button>
        <button onclick="routineToggle()" style="width:72px;height:72px;border-radius:50%;background:${timerRunning?col:"#1a1a2e"};border:2px solid ${timerRunning?col:"#2a2a4a"};color:${timerRunning?"#080810":"#e2e2e2"};font-size:26px;cursor:pointer;box-shadow:${timerRunning?`0 0 24px ${col}55`:"none"};transition:all 0.2s">${timerRunning?"⏸":"▶"}</button>
        <button onclick="routineNext()" style="width:48px;height:48px;border-radius:50%;background:#111120;border:1px solid #1e1e2e;color:#666;font-size:18px;cursor:pointer">⏭</button>
      </div>
      <button onclick="routineSendToEnd()" style="background:none;border:1px solid #161626;color:#333;font-family:inherit;font-size:9px;letter-spacing:0.15em;padding:7px 18px;border-radius:8px;cursor:pointer">MOVER AL FINAL</button>
    </div>
    <div style="border-top:1px solid #0f0f1e;max-height:180px;overflow-y:auto">
      ${routineQueue.map((idx,qi)=>{const s=rt.steps[idx],isCur=qi===0;return`<div style="display:flex;align-items:center;gap:12px;padding:8px 20px;background:${isCur?rt.col+"08":"transparent"};border-left:2px solid ${isCur?rt.col:"transparent"}"><span style="font-size:16px;opacity:${isCur?1:0.4}">${s.icon}</span><div style="flex:1"><div style="font-size:12px;color:${isCur?"#e2e2e2":"#333"};font-weight:${isCur?500:300}">${s.label}</div></div><div style="font-size:10px;color:${isCur?rt.col:"#252535"}">${s.dur}m</div></div>`;}).join("")}
      ${Object.keys(routineCompleted).length>0?`<div style="padding:8px 20px 0;border-top:1px solid #0f0f1e;margin-top:4px">${Object.keys(routineCompleted).map(idx=>{const s=rt.steps[idx];return`<div style="display:flex;align-items:center;gap:12px;padding:6px 0;opacity:0.3"><span style="font-size:14px">✓</span><div style="font-size:11px;color:#444;text-decoration:line-through">${s.label}</div></div>`;}).join("")}</div>`:""}
    </div>
  </div>`;
}

function setTab(t){currentTab=t;render();}
function setHistTab(t){histTab=t;render();}
function toggleHabit(id,key){const ch={...getChecked(key)};ch[id]=!ch[id];setChecked(key,ch);persistDay(key);render();}
function quickComplete(id){const k=todayKey(),ch={...getChecked(k)};ch[id]=true;setChecked(k,ch);persistDay(k);render();}
function handleSocial(key){if(socialExpanded)return;const ch={...getChecked(key)},v=!ch.social;ch.social=v;setChecked(key,ch);setSocial(key,{flirt:v,strangers:v,friends:v});persistDay(key);render();}
function toggleSocialExpand(key){socialExpanded=!socialExpanded;render();}
function toggleSub(id,key){const soc={...getSocial(key)};soc[id]=!soc[id];setSocial(key,soc);const ch={...getChecked(key)};ch.social=Object.values(soc).some(Boolean);setChecked(key,ch);persistDay(key);render();}
function resetDay(key){setChecked(key,{});setSocial(key,{flirt:false,strangers:false,friends:false});persistDay(key);render();}
function openEditDay(key){editDayKey=key;socialExpanded=false;render();}
function closeEditDay(){editDayKey=null;socialExpanded=false;render();}

function startRoutine(id){routineId=id;routineQueue=ROUTINES[id].steps.map((_,i)=>i);routineCompleted={};timerSecs=ROUTINES[id].steps[0].dur*60;timerRunning=false;if(timerInterval)clearInterval(timerInterval);render();}
function closeRoutine(){if(timerInterval)clearInterval(timerInterval);timerRunning=false;timerInterval=null;routineId=null;routineQueue=[];routineCompleted={};render();}
function finishRoutine(){const id=routineId;closeRoutine();quickComplete(id);setTab("home");}
function routineToggle(){
  timerRunning=!timerRunning;
  if(timerRunning){timerInterval=setInterval(()=>{if(timerSecs<=1){clearInterval(timerInterval);timerRunning=false;routineNext();}else{timerSecs--;renderRoutineTimer();}},1000);}
  else{clearInterval(timerInterval);}
  render();
}
function routineReset(){clearInterval(timerInterval);timerRunning=false;if(routineId&&routineQueue.length>0)timerSecs=ROUTINES[routineId].steps[routineQueue[0]].dur*60;render();}
function routineNext(){clearInterval(timerInterval);timerRunning=false;if(routineQueue.length===0)return;routineCompleted[routineQueue[0]]=true;routineQueue=routineQueue.slice(1);if(routineQueue.length>0)timerSecs=ROUTINES[routineId].steps[routineQueue[0]].dur*60;render();}
function routineSendToEnd(){if(routineQueue.length<2)return;routineQueue=[...routineQueue.slice(1),routineQueue[0]];clearInterval(timerInterval);timerRunning=false;timerSecs=ROUTINES[routineId].steps[routineQueue[0]].dur*60;render();}
function renderRoutineTimer(){
  const rt=ROUTINES[routineId],current=routineQueue[0]!==undefined?rt.steps[routineQueue[0]]:null;
  if(!current)return;
  const mins=Math.floor(timerSecs/60),secs=timerSecs%60,fmtTime=`${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
  const col=current.isBreak?"#f59e0b":rt.col,r=96,c=2*Math.PI*r,timerPct=timerSecs/(current.dur*60),off=c-(1-timerPct)*c;
  const circles=document.querySelectorAll("circle[stroke-dasharray]");
  if(circles.length>0)circles[0].setAttribute("stroke-dashoffset",off);
  document.querySelectorAll("div").forEach(div=>{if(/^\d{2}:\d{2}$/.test(div.textContent.trim())&&div.style.fontFamily&&div.style.fontFamily.includes("Bebas")){div.textContent=fmtTime;}});
}

const TABS_ORDER=["home","today","stats","history"];
let touchStartX=0,touchStartY=0;
document.addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*0.8)return;
  if(dx>0){if(editDayKey){closeEditDay();return;}if(routineId){closeRoutine();return;}}
  if(routineId||editDayKey)return;
  const idx=TABS_ORDER.indexOf(currentTab);
  if(dx<0&&idx<TABS_ORDER.length-1)setTab(TABS_ORDER[idx+1]);
  if(dx>0&&idx>0)setTab(TABS_ORDER[idx-1]);
},{passive:true});

boot();
</script>
</body>
</html>

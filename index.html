<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html{background:#07070f;height:100%;}
html,body{height:100%;background:#07070f;color:#ececf2;font-family:'DM Sans','DM Mono',system-ui,sans-serif;
  overflow:hidden;position:fixed;width:100%;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5;}
input,textarea{-webkit-user-select:text;user-select:text;}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:smooth;}
#scroll::-webkit-scrollbar{display:none;}
#nav{transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .25s ease;position:fixed;bottom:0;left:0;right:0;background:rgba(7,7,15,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #111120;display:flex;padding-bottom:max(calc(env(safe-area-inset-bottom) - 24px),4px);z-index:999;}
.nav-btn{flex:1;min-height:46px;padding:9px 4px 9px;background:none;border:none;font-family:inherit;font-size:13.5px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s;border-top:2px solid transparent;color:#adadbf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.nav-btn:active{opacity:.6;}
#nav.tucked{transform:translateY(115%);opacity:0;pointer-events:none;}
/* ── TODAY section order — day vs night ────────────────────── */
.today>*{order:6;}
.today .t-head{order:1;}
.today .t-streak{order:2;}
.today .t-ring{order:3;}
.today .t-grade{order:4;}
.today .t-rout{order:5;}
.today .t-lvl1{order:7;}
.today .t-lvl2{order:8;}
.today .t-lvl3{order:9;}
.today .t-note{order:10;}
.today .t-reset{order:11;}
/* Night layout is mobile-only by design: on desktop the two-column
   flow always uses day order (CSS columns ignore `order` anyway). */
@media(max-width:879px){

               col:LVL_COL[n],routine:!!CFG.h[id].routine,combo:!!CFG.h[id].combo}));
}
function applyCfg(){
  LVL1=buildLevel(1);LVL2=buildLevel(2);LVL3=buildLevel(3);
  ROUTINES=CFG.routines||{};
  LVL1_MAX=LVL1.reduce((a,i)=>a+i.pts,0);
  LVL2_MAX=LVL2.reduce((a,i)=>a+i.pts,0);
  LVL3_MAX=LVL3.reduce((a,i)=>a+i.pts,0);
  MAX=LVL1_MAX+LVL2_MAX+LVL3_MAX;
}
applyCfg();

const GRADE=s=>{
  const p=MAX>0?(s/MAX)*100:0;
  if(p>=92)return{l:"S+",c:"#FFF1A8",g:"#FFD70099",n:"UNSTOPPABLE",bg:"rgba(255,241,168,0.07)"};
  if(p>=84)return{l:"S",c:"#FFD700",g:"#FFD70055",n:"LEGENDARY",bg:"rgba(255,215,0,0.05)"};
  if(p>=71)return{l:"A",c:"#4ade80",g:"#4ade8055",n:"EXCELLENT",bg:"rgba(74,222,128,0.05)"};
  if(p>=59)return{l:"B",c:"#60a5fa",g:"#60a5fa55",n:"SOLID",bg:"rgba(96,165,250,0.05)"};
  if(p>=42)return{l:"C",c:"#f59e0b",g:"#f59e0b55",n:"AVERAGE",bg:"rgba(245,158,11,0.05)"};
  if(p>=21)return{l:"D",c:"#f97316",g:"#f9731655",n:"LOW",bg:"rgba(249,115,22,0.05)"};
  return{l:"F",c:"#ef4444",g:"#ef444455",n:"LOST",bg:"rgba(239,68,68,0.05)"};
};

function dateKey(d){
  const tz=CFG.tz&&CFG.tz!=='device'?CFG.tz:undefined;
  try{ return new Intl.DateTimeFormat('sv-SE',tz?{timeZone:tz}:{}).format(d); }
  catch(e){ return new Intl.DateTimeFormat('sv-SE').format(d); }
}
const todayKey=()=>dateKey(new Date());
// pure date arithmetic on YYYY-MM-DD (DST-safe)
function keyMinus(key,days){
  const[y,m,dd]=key.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,dd));
  t.setUTCDate(t.getUTCDate()-days);
  return t.toISOString().slice(0,10);
}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

const cfgKey=()=>`shaah_cfg_${USER?USER.id:'anon'}`;
const cacheKey=()=>`shaah_cache_${USER?USER.id:"anon"}`;
const loadCache=()=>{_state=get(cacheKey())||{};};
const saveCache=()=>set(cacheKey(),_state);

function statusEl(){return document.getElementById('sync-status');}
function setStatus(text,color){const e=statusEl();if(e){e.textContent=text;e.style.color=color;}}

// ── Data accessors — all derive from _state ────────────────
const blankSocial=()=>({flirt:false,strangers:false,friends:false});
const getChecked=k=>(_state[k]&&_state[k].checks)||{};
const getSocial=k=>(_state[k]&&_state[k].social)||blankSocial();

function calcScore(key){
  const ch=getChecked(key),soc=getSocial(key);
  const activeSubs=Object.values(soc).filter(Boolean).length;
  const l1=LVL1.reduce((a,i)=>a+(ch[i.id]?safePts(i.pts):0),0);
  const l2=LVL2.reduce((a,i)=>a+(ch[i.id]?safePts(i.pts):0),0);
  const l3=LVL3.reduce((a,i)=>a+(i.combo?(ch[i.id]?(activeSubs>0?Math.round((activeSubs/3)*i.pts):i.pts):0):(ch[i.id]?i.pts:0)),0);
  return{score:l1+l2+l3,l1,l2,l3,done:Object.values(ch).filter(Boolean).length};
}

// History is DERIVED, never stored separately — cannot drift from checks
function getHistory(){
  const h={};
  for(const date of Object.keys(_state)){
    if(!DATE_RE.test(date))continue;
    const{score,l1,l2,l3,done}=calcScore(date);
    if(score>0)h[date]={score,grade:GRADE(score).l,l1,l2,l3,done};
  }
  return h;
}

// ── Writes — optimistic local, then push to server ─────────
const _pending={};
function persistDay(key){
  if(!DATE_RE.test(key))return;
  saveCache();
  if(!USER)return;
  clearTimeout(_pending[key]);
  _pending[key]=setTimeout(async()=>{
    const ch=getChecked(key),soc=getSocial(key);
    const{score,l1,l2,l3,done}=calcScore(key);
    const anything=Object.values(ch).some(Boolean)||!!getNote(key);
    try{
      if(!anything){
        await sb.from('day_logs').delete().eq('user_id',USER.id).eq('date',key);
        delete _state[key];saveCache();
      }else{
        await sb.from('day_logs').upsert({
          user_id:USER.id,date:key,
          data:{score,grade:GRADE(score).l,l1,l2,l3,done,_checks:ch,_social:soc,_note:(_state[key]&&_state[key].note)||''}
        },{onConflict:'user_id,date'});
      }
    }catch(e){}
  },250);
}

function setChecked(k,v){if(!_state[k])_state[k]={checks:{},social:blankSocial(),note:''};_state[k].checks=v;}
function getNote(k){const n=_state[k]&&_state[k].note;return typeof n==='string'?n:'';}
function setNote(k,v){if(!_state[k])_state[k]={checks:{},social:blankSocial(),note:''};_state[k].note=String(v==null?'':v).slice(0,5000);persistDay(k);}
function setSocial(k,v){if(!_state[k])_state[k]={checks:{},social:blankSocial(),note:''};_state[k].social=v;}

// ── Server load + realtime ─────────────────────────────────
function saveCfg(){
  set(cfgKey(),CFG); applyCfg();
  if(USER){try{sb.from('day_logs').upsert({user_id:USER.id,date:'settings',data:{_cfg:CFG}},{onConflict:'user_id,date'});}catch(e){}}
}
// One-time migration: Pomodoro 6→5 so MAX lands on 118 (100 + חי)
function migrateCfg(){
  if(CFG.v>=3){return;}
  if(!(CFG.v>=2)){
  if(CFG.h&&CFG.h.pomodoro&&Number(CFG.h.pomodoro.p)===6)CFG.h.pomodoro.p=5;
    CFG.v=2;
  }
  if(Number(CFG.nightFrom)===18)CFG.nightFrom=20.5;   // 6pm → 8:30pm
  if(CFG.nightUntil==null)CFG.nightUntil=7;           // extend night through the small hours
  CFG.v=3; applyCfg();
}
function loadCfgLocal(){
  const c=get(cfgKey());
  if(c){CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),c);applyCfg();migrateCfg();}
}
function rowToState(row){
  if(row.date==='settings'){
    if(row.data&&row.data._cfg){CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),row.data._cfg);applyCfg();migrateCfg();set(cfgKey(),CFG);}
    return;
  }
  const d=row.data||{};
  _state[row.date]={checks:d._checks||{},social:d._social||blankSocial(),note:d._note||''};
}

// A user with history but no saved config predates the generic defaults —
// restore their original habit set instead of overwriting it.
function adoptLegacyIfVeteran(hadSettingsRow,rowCount){
  if(hadSettingsRow||rowCount===0)return false;
  CFG=JSON.parse(JSON.stringify(LEGACY_CFG));
  CFG.v=3; applyCfg(); set(cfgKey(),CFG); saveCfg();
  return true;
}
async function loadAll(){
  if(!USER)return;
  setStatus('SYNC…','#f59e0b');
  try{
    const{data,error}=await sb.from('day_logs').select('date,data').eq('user_id',USER.id);
    if(error)throw error;
    const rows=data||[];
    const hadSettings=rows.some(r=>r.date==='settings');
    const dayRows=rows.filter(r=>r.date!=='settings').length;
    _state={};
    rows.forEach(rowToState);
    adoptLegacyIfVeteran(hadSettings,dayRows);
    saveCache();
    setStatus(_live?'LIVE':'✓','#4ade80');
  }catch(e){
    setStatus('OFFLINE','#ef4444');
  }
  render();
}

function subscribeRealtime(){
  if(!USER)return;
  sb.channel('shaah-'+USER.id)
    .on('postgres_changes',
      {event:'*',schema:'public',table:'day_logs',filter:`user_id=eq.${USER.id}`},
      payload=>{
        if(payload.eventType==='DELETE'){
          if(payload.old&&payload.old.date)delete _state[payload.old.date];
        }else if(payload.new){
          rowToState(payload.new);
        }
        saveCache();
        render();
        setStatus('LIVE','#4ade80');
      })
    .subscribe(s=>{
      _live=(s==='SUBSCRIBED');
      if(_live)setStatus('LIVE','#4ade80');
    });
}

async function boot(){
  // Surface any OAuth error returned in the URL
  const q=new URLSearchParams(location.search), hp=new URLSearchParams(location.hash.slice(1));
  const err=q.get('error_description')||hp.get('error_description')||q.get('error')||hp.get('error');
  if(err)AUTH_ERR=decodeURIComponent(err.replace(/\+/g,' '));

  let session=null;
  try{
    const r=await sb.auth.getSession();
    session=r.data.session;
    // PKCE: if a ?code= is present but no session yet, exchange it explicitly
    if(!session&&q.get('code')){
      const ex=await sb.auth.exchangeCodeForSession(window.location.href);
      if(ex.error)AUTH_ERR=ex.error.message; else session=ex.data.session;
    }
  }catch(e){AUTH_ERR=e.message;}

  USER=session?session.user:null;

  // Clean auth params out of the URL once handled
  if(USER&&(location.search||location.hash)){
    history.replaceState({},'',location.pathname);
  }

  if(USER){
    loadCfgLocal();
    loadCache();
    loadLvl();
    loadSec();
    restoreRoutine();
    if(!get(tourKey()))tourStep=0,currentTab=TOUR[0].tab;
    render();
    await loadAll();
    subscribeRealtime();
  }else{
    render();
  }
}

function getStreak(){
  const hh=getHistory(),tk=todayKey();let s=0;
  for(let i=0;i<3650;i++){const k=keyMinus(tk,i);const need=MAX*0.5;if(hh[k]&&hh[k].score>=need)s++;else if(i>0)break;}
  return s;
}
function getBestStreak(){
  const hh=getHistory(),need=MAX*0.5,keys=Object.keys(hh).filter(k=>DATE_RE.test(k)&&hh[k].score>=need).sort();
  let best=0,run=0,prev=null;
  for(const k of keys){
    const d=new Date(k+'T12:00:00');
    if(prev&&Math.round((d-prev)/86400000)===1)run++; else run=1;
    if(run>best)best=run; prev=d;
  }
  return best;
}

  try{ if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();
       if(_actx.state==='suspended')_actx.resume(); }catch(e){}

function chime(times){
  try{
    unlockAudio(); if(!_actx)return;
    const n=times||1;
    for(let i=0;i<n;i++){
      const t=_actx.currentTime+i*0.22;
      const o=_actx.createOscillator(),g=_actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(880,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g);g.connect(_actx.destination);o.start(t);o.stop(t+0.2);
    }
  }catch(e){}
}

      const o=_actx.createOscillator(),g=_actx.createGain();
      o.frequency.value=20; g.gain.value=0.0008;
      o.connect(g); g.connect(_actx.destination); o.start();

function restoreRoutine(){
  const r=get(RKEY()); if(!r)return false;
  if(r.day&&r.day!==todayKey()){del(RKEY());return false;}   // yesterday's — discard
  sessions=r.sessions||{};
  for(const id of Object.keys(sessions)) if(!ROUTINES[id]) delete sessions[id];
  if(!Object.keys(sessions).length)return false;
  routineId=(r.routineId&&sessions[r.routineId])?r.routineId:null;
  routineView=!!r.routineView&&!!routineId;
  // recompute anything that was running while the app was closed
  for(const id of Object.keys(sessions)){
    const s=sessions[id];
    if(s.running&&s.endAt){
      s.secs=Math.max(0,Math.round((s.endAt-Date.now())/1000));
      if(s.secs<=0){s.running=false;s.endAt=null;advanceSession(id);}
    }
  }
  syncFromSession(); ensureTick();
  return true;
}

function render(){

  // Full-screen modes own the whole viewport — no top bar, no nav
  if(settingsOpen){el.innerHTML=renderSettings();nav.style.display="none";tuckNav(false);renderTour();renderResume();return;}
  if(routineId&&routineView){el.innerHTML=renderRoutine();nav.style.display="none";tuckNav(false);renderTour();renderResume();return;}
  if(editDayKey){el.innerHTML=renderEditDay();nav.style.display="none";tuckNav(false);renderTour();renderResume();return;}
  nav.style.display="flex";
  const bar=topbarHTML();   // scrolls away with the content
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  if(currentTab==="today")el.innerHTML=bar+renderToday(todayKey());

  renderResume();
  initScrollHide();
}

function weekReview(){
  const d=getDays(14),cur=d.slice(7),prev=d.slice(0,7);

}

          <div style="font-size:40px;margin-bottom:4px">${current.icon}</div>
          <div id="timer-clock" style="font-family:'Bebas Neue';font-size:52px;line-height:1;color:${col};letter-spacing:-0.02em">${fmtTime}</div>
          <div style="font-size:14.5px;color:#adadbf;letter-spacing:0.1em">${current.dur} MIN</div>
        </div>
      </div>
      <div style="text-align:center">
        <div style="font-size:19px;font-weight:500;color:#e2e2e2">${current.label}</div>
        ${routineQueue.length>1?`<div style="font-size:15px;color:#9a9ab2;margin-top:6px">Next: ${rt.steps[routineQueue[1]]?.icon} ${rt.steps[routineQueue[1]]?.label}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:20px;margin-top:8px">
        <button onclick="routineReset()" style="width:48px;height:48px;border-radius:50%;background:#111120;border:1px solid #1e1e2e;color:#adadbf;font-size:19px;cursor:pointer">↺</button>
        <button onclick="routineToggle()" style="width:72px;height:72px;border-radius:50%;background:${timerRunning?col:"#1a1a2e"};border:2px solid ${timerRunning?col:"#2a2a4a"};color:${timerRunning?"#080810":"#e2e2e2"};font-size:27px;cursor:pointer;box-shadow:${timerRunning?`0 0 24px ${col}55`:"none"};transition:all 0.2s">${timerRunning?"⏸":"▶"}</button>
        <button onclick="routineNext()" style="width:48px;height:48px;border-radius:50%;background:#111120;border:1px solid #1e1e2e;color:#adadbf;font-size:19px;cursor:pointer">⏭</button>
      </div>
      <button onclick="routineSendToEnd()" style="background:none;border:1px solid #161626;color:#a4a4ba;font-family:inherit;font-size:14.5px;letter-spacing:0.1em;padding:7px 18px;border-radius:8px;cursor:pointer">MOVE TO END</button>
    </div>
    <div style="border-top:1px solid #0f0f1e;max-height:180px;overflow-y:auto">
      ${routineQueue.map((idx,qi)=>{const s=rt.steps[idx],isCur=qi===0;return`<div style="display:flex;align-items:center;gap:12px;padding:8px 20px;background:${isCur?rt.col+"08":"transparent"};border-left:2px solid ${isCur?rt.col:"transparent"}"><span style="font-size:17px;opacity:${isCur?1:0.4}">${esc(s.icon)}</span><div style="flex:1"><div style="font-size:15px;color:${isCur?"#e2e2e2":"#333"};font-weight:${isCur?600:450}">${s.label}</div></div><div style="font-size:15px;color:${isCur?rt.col:"#252535"}">${s.dur}m</div></div>`;}).join("")}
      ${Object.keys(routineCompleted).length>0?`<div style="padding:8px 20px 0;border-top:1px solid #0f0f1e;margin-top:4px">${Object.keys(routineCompleted).map(idx=>{const s=rt.steps[idx];return`<div style="display:flex;align-items:center;gap:12px;padding:6px 0;opacity:0.3"><span style="font-size:17px">✓</span><div style="font-size:15px;color:#b0b0c2;text-decoration:line-through">${s.label}</div></div>`;}).join("")}</div>`:""}
    </div>
  </div>`;
}

function setTab(t){currentTab=t;_lastY=0;tuckNav(false);render();}
function setHistTab(t){histTab=t;render();}
function toggleHabit(id,key){haptic(10);const ch={...getChecked(key)};ch[id]=!ch[id];setChecked(key,ch);persistDay(key);render();}
function quickComplete(id){haptic(18);const k=todayKey(),ch={...getChecked(k)};ch[id]=true;setChecked(k,ch);persistDay(k);render();}
function handleSocial(key){if(socialExpanded)return;haptic(10);const ch={...getChecked(key)},v=!ch.social;ch.social=v;setChecked(key,ch);setSocial(key,{flirt:v,strangers:v,friends:v});persistDay(key);render();}
function toggleSocialExpand(key){socialExpanded=!socialExpanded;render();}
function toggleSub(id,key){haptic(8);const soc={...getSocial(key)};soc[id]=!soc[id];setSocial(key,soc);const ch={...getChecked(key)};ch.social=Object.values(soc).some(Boolean);setChecked(key,ch);persistDay(key);render();}
function resetDay(key){haptic([30,40,30]);setChecked(key,{});setSocial(key,{flirt:false,strangers:false,friends:false});persistDay(key);render();}
function openEditDay(key){editDayKey=key;socialExpanded=false;render();}
function closeEditDay(){editDayKey=null;socialExpanded=false;render();}

// ═══ Routine engine — independent, concurrent sessions ═══════
// sessions[id] = {q:[stepIdx], done:{}, secs, running, endAt}
// routineId = which session is currently OPEN on screen (null = none)
function newSession(id){
  return {q:ROUTINES[id].steps.map((_,k)=>k),done:{},
          secs:ROUTINES[id].steps[0].dur*60,running:false,endAt:null};
}
function S(id){return sessions[id||routineId]||null;}
function anyRunning(){return Object.values(sessions).some(s=>s.running);}
function liveSessions(){return Object.keys(sessions);}

// keep the legacy view-globals in sync so render code stays unchanged
function syncFromSession(){
  const s=S(); if(!s)return;
  routineQueue=s.q; routineCompleted=s.done;
  timerSecs=s.secs; timerRunning=s.running; timerEndAt=s.endAt;
}
function syncToSession(){
  const s=S(); if(!s)return;
  s.q=routineQueue; s.done=routineCompleted;
  s.secs=timerSecs; s.running=timerRunning; s.endAt=timerEndAt;
}

function startRoutine(id){
  if(!ROUTINES[id])return;
  if(!sessions[id])sessions[id]=newSession(id);   // resume if it already exists
  routineId=id; routineView=true;
  syncFromSession(); unlockAudio(); haptic(12);
  ensureTick(); saveRoutine(); render();
}
function exitRoutine(){syncToSession();routineView=false;routineId=null;haptic(8);saveRoutine();render();}
function openRoutine(id){startRoutine(id);}
function reopenRoutine(id){startRoutine(id||liveSessions()[0]);}

// Discard just this session
function closeRoutine(id){
  const target=id||routineId; if(!target)return;
  delete sessions[target];
  if(routineId===target){routineId=null;routineView=false;routineQueue=[];routineCompleted={};timerSecs=0;timerRunning=false;timerEndAt=null;}
  if(!anyRunning())audioKeepAlive(false);
  if(!liveSessions().length&&timerInterval){clearInterval(timerInterval);timerInterval=null;}
  saveRoutine(); render();
}
function finishRoutine(){
  const id=routineId; haptic([40,60,120]); chime(3);
  closeRoutine(id); if(id)quickComplete(id); setTab("today");
}

// ── One interval drives every running session ──
function ensureTick(){
  if(timerInterval)return;
  timerInterval=setInterval(()=>{
    let dirty=false;
    for(const id of liveSessions()){
      const s=sessions[id];
      if(!s.running||!s.endAt)continue;
      s.secs=Math.max(0,Math.round((s.endAt-Date.now())/1000));
      if(s.secs<=0){s.running=false;s.endAt=null;alertStepDone();advanceSession(id);dirty=true;}
    }
    if(!anyRunning())audioKeepAlive(false);
    syncFromSession();
    if(dirty){saveRoutine();render();}
    else{
      // the open runner AND any background pills both need refreshing
      if(routineId&&routineView)renderRoutineTimer();
      updateResumeClock();
    }
  },250);
}
function advanceSession(id){
  const s=sessions[id]; if(!s||!s.q.length)return;
  s.done[s.q[0]]=true; s.q=s.q.slice(1);
  s.secs=s.q.length?ROUTINES[id].steps[s.q[0]].dur*60:0;
  s.running=false; s.endAt=null;
}

function routineToggle(){
  const s=S(); if(!s)return;
  unlockAudio(); haptic(12);
  s.running=!s.running;
  if(s.running){s.endAt=Date.now()+s.secs*1000;ensureTick();audioKeepAlive(true);}
  else{s.secs=Math.max(0,Math.round((s.endAt-Date.now())/1000));s.endAt=null;if(!anyRunning())audioKeepAlive(false);}
  syncFromSession(); saveRoutine(); render();
}
function routineReset(){
  const s=S(); if(!s)return;
  haptic(12); s.running=false; s.endAt=null;
  if(s.q.length)s.secs=ROUTINES[routineId].steps[s.q[0]].dur*60;
  if(!anyRunning())audioKeepAlive(false);
  syncFromSession(); saveRoutine(); render();
}
function routineNext(){
  const s=S(); if(!s||!s.q.length)return;
  advanceSession(routineId); syncFromSession();
  if(!anyRunning())audioKeepAlive(false);
  saveRoutine(); render();
}
function routineSendToEnd(){
  const s=S(); if(!s||s.q.length<2)return;
  haptic(12); s.q=[...s.q.slice(1),s.q[0]];
  s.running=false; s.endAt=null; s.secs=ROUTINES[routineId].steps[s.q[0]].dur*60;
  syncFromSession(); saveRoutine(); render();
}
function updateResumeClock(){
  for(const id of liveSessions()){
    const c=document.getElementById("resume-clock-"+id),s=sessions[id];
    if(!c||!s)continue;
    const m=Math.floor(s.secs/60),x=s.secs%60;
    c.textContent=`${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`;
  }
}
function renderRoutineTimer(){
  const rt=ROUTINES[routineId],current=routineQueue[0]!==undefined?rt.steps[routineQueue[0]]:null;
  if(!current)return;
  const mins=Math.floor(timerSecs/60),secs=timerSecs%60;
  const clock=document.getElementById('timer-clock');
  if(clock)clock.textContent=`${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
  const ring=document.getElementById('timer-ring');
  if(ring){
    const r=96,c=2*Math.PI*r,pct=timerSecs/(current.dur*60);
    ring.setAttribute('stroke-dashoffset',c-(1-pct)*c);
  }
}

const TABS_ORDER=["today","stats","history"];
let touchStartX=0,touchStartY=0;
document.addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx)*0.8)return;
  if(dx>0){if(settingsOpen){closeSettings();return;}if(editDayKey){closeEditDay();return;}if(routineId&&routineView){exitRoutine();return;}}
  if((routineId&&routineView)||editDayKey||settingsOpen)return;
  const idx=TABS_ORDER.indexOf(currentTab);
  if(dx<0&&idx<TABS_ORDER.length-1)setTab(TABS_ORDER[idx+1]);
  if(dx>0&&idx>0)setTab(TABS_ORDER[idx-1]);
},{passive:true});

boot();
</script>

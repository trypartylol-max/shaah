<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0f">
<title>Event Scorecard</title>
<style>
:root{--bg:#0a0a0f;--fg:#e8e0d0;--gold:#ffd700;--mut:#665f58;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 20% 50%,rgba(120,40,200,.08),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,180,0,.05),transparent 50%);color:var(--fg);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding-bottom:80px}
header{border-bottom:1px solid rgba(255,215,0,.15);padding:20px 24px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header small{display:block;font-size:10px;letter-spacing:4px;color:#ffd70066;text-transform:uppercase;margin-bottom:3px}
header h1{margin:0;font-size:22px;color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid rgba(255,255,255,.1);color:#888;border-radius:6px;padding:5px 12px;font:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.on{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.4);color:var(--gold)}
.btn.g{color:#a8ff78;border-color:rgba(168,255,120,.25);background:rgba(168,255,120,.06)}
main{max-width:700px;margin:0 auto;padding:0 16px}
.lbl{font-size:10px;letter-spacing:3px;color:#ffd70066;text-transform:uppercase;margin:24px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label.f{display:block;font-size:10px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
input,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--fg);font:inherit;font-size:14px;padding:9px 12px;outline:none;color-scheme:dark}
textarea{resize:vertical;line-height:1.5;font-size:12px}
.card{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700;color:#fff;font-size:14px}
.ch .sc{margin-left:auto;font-size:11px;font-weight:400}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;font-size:13px;color:#b0a898}
.stars{display:flex;gap:3px}
.stars button{background:none;border:none;cursor:pointer;font-size:20px;padding:0;line-height:1;filter:grayscale(1) opacity(.2);transition:transform .1s}
.stars button.on{filter:none}
.stars button:hover{transform:scale(1.25)}
.primary{width:100%;background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(180,100,255,.14));border:1px solid rgba(255,215,0,.35);border-radius:10px;color:#fff;font:inherit;font-weight:700;font-size:14px;padding:13px;cursor:pointer;margin:8px 0 32px}
.err{padding:9px 14px;border-radius:8px;margin:12px 0;font-size:12px;background:rgba(255,100,100,.07);border:1px solid rgba(255,100,100,.2);color:#ff8888}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 18px}
.kpi{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.kpi b{display:block;color:var(--gold);font-size:18px;line-height:1.2;word-break:break-word}
.kpi b.s{font-size:11px}
.kpi span{font-size:9px;color:#555;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:7px;color:#665f58;font:inherit;font-size:11px;padding:5px 11px;cursor:pointer}
.chip.on{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.4);color:var(--gold)}
.panel{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;padding:18px 10px 14px;margin-bottom:20px}
.pill{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.2);border-radius:20px;padding:3px 14px;font-size:11px;color:#665f58}
.pill b{font-size:17px}
.bar{background:rgba(255,255,255,.07);border-radius:3px;height:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item.on{border-color:rgba(255,215,0,.18);background:rgba(255,215,0,.04)}
.item .top{display:flex;align-items:center;gap:12px}
.circ{min-width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.item .t{flex:1;overflow:hidden}.item .t b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{font-size:10px;color:#555}
.mini{display:flex;gap:3px}.mini i{width:5px;height:26px;border-radius:2px}
.det{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.note{font-size:11px;color:#555;font-style:italic;margin-top:4px;padding-left:8px;border-left:2px solid rgba(255,255,255,.08)}
.del{background:rgba(255,100,100,.07);border:1px solid rgba(255,100,100,.2);border-radius:7px;color:#ff8888;font:inherit;font-size:11px;padding:5px 14px;cursor:pointer;margin-top:10px}
.empty{text-align:center;padding:70px 0;color:#3a3530;font-size:14px}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:10px;color:#665f58}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.sync{font-size:10px;letter-spacing:1px;color:#665f58;align-self:center}.sync.ok{color:#a8ff78}.sync.err{color:#ff9f43}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>
  <div><small>Live Music · Local</small><h1>Event Scorecard</h1></div>
  <nav>
    <a class="btn" href="../escritorio/">← Escritorio</a>
    <span class="sync" id="syncSt" role="status"></span><button class="btn g" id="loginBtn" hidden>Entrar con Google</button>
    <button class="btn on" id="nForm">+ Evaluar</button>
    <button class="btn" id="nDash">Dashboard</button>
  </nav>
</header>
<main>
  <section id="vForm"></section>
  <section id="vDash" hidden></section>
</main>
<script src="../assets/supabase-2.118.0.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
const CATS=[
{id:'produccion',label:'Producción',full:'Producción General',icon:'🎪',color:'#a78bfa',subs:[['sonido','Sonido / Mezcla en vivo'],['iluminacion','Iluminación & Visuales'],['escenario','Diseño del Escenario'],['pantallas','Pantallas / Video']]},
{id:'venue',label:'Venue',full:'Venue & Logística',icon:'🏟️',color:'#60a5fa',subs:[['capacidad','Capacidad & Distribución'],['acceso','Acceso / Entradas / Fila'],['banos','Baños & Limpieza'],['ubicacion','Ubicación & Transporte']]},
{id:'experiencia',label:'Experiencia',full:'Experiencia del Asistente',icon:'🎟️',color:'#34d399',subs:[['seguridad','Seguridad & Staff'],['crowd','Ambiente / Crowd'],['comida','Comida & Bebida'],['precio_valor','Precio / Valor']]},
{id:'arte',label:'Arte',full:'Dirección Artística',icon:'🎨',color:'#fbbf24',subs:[['concepto','Concepto & Narrativa'],['setlist','Setlist & Flujo'],['interaccion','Interacción con el público'],['sorpresas','Momentos especiales']]}
];
const KEY='music-scorecard-events';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>{a=a.filter(x=>x>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0};
const col=s=>s>=4?'#a8ff78':s>=3?'#ffd700':s>=2?'#ff9f43':'#ff6b6b';
const lab=s=>s===0?'—':s>=4.5?'Impecable':s>=3.5?'Muy bueno':s>=2.5?'Decente':s>=1.5?'Flojo':'Pésimo';
const scores=e=>{const c={};CATS.forEach(k=>c[k.id]=avg(k.subs.map(s=>e.ratings[k.id+'_'+s[0]]||0)));c.global=avg(CATS.map(k=>c[k.id]));return c};
const name=e=>e.info.artista||e.info.nombre||'Sin nombre';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}
if(!Array.isArray(all))all=[];
all.forEach((e,i)=>{ // migra eventos guardados antes de la sincronización
  if(!e.id){e.id=uuid();e._dirty=true}
  if(!e.created)e.created=1700000000000+i;
});
let events=[];
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(all))}catch(_){}};
const refresh=()=>{events=all.filter(e=>!e._del).sort((a,b)=>(a.created||0)-(b.created||0))};
const pub=e=>({id:e.id,info:e.info,ratings:e.ratings,notas:e.notas,generalNota:e.generalNota,date:e.date,created:e.created});
const rowData=e=>{const o=pub(e);delete o.id;return o};
const fromRow=r=>Object.assign({},r.data,{id:r.id,_rev:r.updated_at,_dirty:false,_del:!!r.deleted_at});
refresh();
let sel=Math.max(0,events.length-1),tab='radar',open=null,cur='form';
const commit=()=>{persist();refresh();sync()};
let form={info:{},ratings:{},notas:{},general:''},touched=false;

/* ---------- FORM ---------- */
function buildForm(){
  const fields=[['nombre','Nombre del evento',1],['artista','Artista / Acto principal'],['fecha','Fecha','date'],['venue','Venue'],['ciudad','Ciudad']];
  $('#vForm').innerHTML=`<div class="lbl">Datos del Evento</div><div class="grid2">${fields.map(([k,l,t])=>`<div class="${t===1?'full':''}"><label class="f">${l}</label><input data-info="${k}" type="${t&&t!==1?t:'text'}"></div>`).join('')}</div>
  <div style="height:20px"></div>
  ${CATS.map(c=>`<div class="card"><div class="ch"><span style="font-size:18px">${c.icon}</span>${c.full}<span class="sc" id="sc_${c.id}" style="color:${c.color}"></span></div>
  ${c.subs.map(s=>`<div class="row"><span>${s[1]}</span><div class="stars" data-k="${c.id}_${s[0]}">${[1,2,3,4,5].map(n=>`<button data-n="${n}">★</button>`).join('')}</div></div>`).join('')}
  <textarea rows="2" data-nota="${c.id}" placeholder="Notas sobre ${c.full.toLowerCase()}..."></textarea></div>`).join('')}
  <label class="f" style="margin-top:6px">Impresión general</label>
  <textarea rows="3" id="general" placeholder="¿Qué te llevaste del evento? ¿Volverías?" style="font-size:13px"></textarea>
  <div id="ferr"></div>
  <button class="primary" id="save">Guardar evaluación</button>`;
}
function paintStars(k){const v=form.ratings[k]||0;document.querySelectorAll(`.stars[data-k="${k}"] button`).forEach(b=>b.classList.toggle('on',+b.dataset.n<=v))}
function paintScores(){CATS.forEach(c=>{const s=avg(c.subs.map(x=>form.ratings[c.id+'_'+x[0]]||0));$('#sc_'+c.id).textContent=s>0?s.toFixed(1)+' ★':''})}
$('#vForm').addEventListener('click',e=>{
  const b=e.target.closest('.stars button');
  if(b){touched=true;const k=b.parentElement.dataset.k,n=+b.dataset.n;form.ratings[k]=form.ratings[k]===n?0:n;paintStars(k);paintScores();return}
  if(e.target.id==='save')save();
});
$('#vForm').addEventListener('input',e=>{
  const t=e.target;touched=true;
  if(t.dataset.info)form.info[t.dataset.info]=t.value;
  else if(t.dataset.nota)form.notas[t.dataset.nota]=t.value;
  else if(t.id==='general')form.general=t.value;
});
function save(){
  if(!form.info.artista&&!form.info.nombre){$('#ferr').innerHTML='<div class="err">Agrega al menos el artista o el nombre del evento.</div>';return}
  all.push({id:uuid(),created:Date.now(),info:{nombre:'',artista:'',fecha:'',venue:'',ciudad:'',...form.info},ratings:form.ratings,notas:form.notas,generalNota:form.general,date:new Date().toLocaleDateString('es-ES'),_dirty:true});
  commit();sel=events.length-1;open=null;
  form={info:{},ratings:{},notas:{},general:''};touched=false;buildForm();paintAll();show('dash');
}
function paintAll(){Object.keys(form.ratings).forEach(paintStars);paintScores()}

/* ---------- CHARTS ---------- */
function radar(sc){
  const cx=150,cy=125,R=88,pt=(i,r)=>{const a=(-90+i*90)*Math.PI/180;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let g='';for(let r=1;r<=5;r++)g+=`<polygon points="${CATS.map((_,i)=>pt(i,R*r/5).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.08)"/>`;
  g+=CATS.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="rgba(255,255,255,.08)"/>`).join('');
  const poly=CATS.map((c,i)=>pt(i,R*(sc[c.id]||0)/5).join(',')).join(' ');
  const labs=CATS.map((c,i)=>{const[x,y]=pt(i,R+18);return`<text x="${x}" y="${y+4}" text-anchor="middle" fill="#998f82" font-size="12" font-family="Georgia">${c.label}</text>`}).join('');
  const dots=CATS.map((c,i)=>{const[x,y]=pt(i,R*(sc[c.id]||0)/5);return`<circle cx="${x}" cy="${y}" r="4" fill="#ffd700"/>`}).join('');
  return`<svg viewBox="0 0 300 250" style="width:100%;max-width:380px;display:block;margin:0 auto">${g}<polygon points="${poly}" fill="rgba(255,215,0,.13)" stroke="#ffd700" stroke-width="2"/>${dots}${labs}</svg>`;
}
function bars(e){
  const rows=CATS.flatMap(c=>c.subs.map(s=>({n:s[1],v:e.ratings[c.id+'_'+s[0]]||0,c:c.color}))).filter(r=>r.v>0);
  if(!rows.length)return'<div class="empty" style="padding:30px">Sin datos</div>';
  return rows.map(r=>`<div style="display:flex;align-items:center;gap:10px;margin:7px 8px;font-size:11px;color:#998f82"><span style="width:150px">${esc(r.n)}</span><div class="bar" style="flex:1;height:9px"><i style="width:${r.v/5*100}%;background:${r.c}"></i></div><span style="width:18px;text-align:right">${r.v}</span></div>`).join('')+
  `<div class="legend">${CATS.map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>`;
}
function trend(){
  if(events.length<2)return'<div class="empty" style="padding:40px;font-size:13px">Necesitas al menos 2 eventos.</div>';
  const W=600,H=240,L=30,B=30,T=10,Rr=14,n=events.length;
  const x=i=>L+(W-L-Rr)*(n===1?0:i/(n-1)),y=v=>T+(H-T-B)*(1-v/5);
  const ser=[['global','Global','#ffd700',2.5],...CATS.map(c=>[c.id,c.label,c.color,1.5])];
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  for(let v=0;v<=5;v++)s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.05)" stroke-dasharray="4 4"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" fill="#555" font-size="10">${v}</text>`;
  events.forEach((e,i)=>{s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" fill="#555" font-size="10" font-family="Georgia">${esc(name(e).slice(0,12))}</text>`});
  ser.forEach(([k,,c,w])=>{
    const pts=events.map((e,i)=>[x(i),y(scores(e)[k])]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`).join('');
  });
  return s+`</svg><div class="legend">${ser.map(a=>`<span><i style="background:${a[2]}"></i>${a[1]}</span>`).join('')}</div>`;
}

/* ---------- DASHBOARD ---------- */
function dash(){
  const v=$('#vDash');
  if(!events.length){v.innerHTML=`<div class="empty"><div style="font-size:40px;margin-bottom:14px">🎪</div>Aún no hay eventos guardados.<br><br><button class="btn on" id="goForm">+ Evaluar primer evento</button><br><br><button class="btn g" id="imp">Importar JSON</button></div>`;return}
  sel=Math.min(sel,events.length-1);
  const e=events[sel],sc=scores(e),all=events.map(scores);
  const best=events[all.reduce((b,s,i)=>s.global>all[b].global?i:b,0)];
  const topCat=CATS.reduce((a,b)=>avg(all.map(s=>s[a.id]))>=avg(all.map(s=>s[b.id]))?a:b);
  const panel=tab==='radar'?`${head(e,sc)}${radar(sc)}<div class="grid2" style="padding:10px 8px 0">${CATS.map(c=>`<div><div style="display:flex;justify-content:space-between;font-size:11px;color:#998f82;margin-bottom:3px"><span>${c.icon} ${c.label}</span><span style="color:${col(sc[c.id])}">${sc[c.id]>0?sc[c.id].toFixed(1):'—'}</span></div><div class="bar"><i style="width:${sc[c.id]/5*100}%;background:${col(sc[c.id])}"></i></div></div>`).join('')}</div>`
    :tab==='bars'?`${head(e,sc)}${bars(e)}`:`<div class="lbl" style="text-align:center;margin:0 0 10px">Evolución por evento</div>${trend()}`;
  v.innerHTML=`<div class="kpis">
    <div class="kpi"><b>${events.length}</b><span>Eventos</span></div>
    <div class="kpi"><b>${avg(all.map(s=>s.global)).toFixed(2)} ★</b><span>Promedio</span></div>
    <div class="kpi"><b class="s">${esc(name(best))}</b><span>Mejor evento</span></div>
    <div class="kpi"><b class="s">${topCat.label}</b><span>Mejor categoría</span></div></div>
  <div class="chips">${events.map((x,i)=>`<button class="chip ${i===sel?'on':''}" data-sel="${i}">${esc(name(x))}</button>`).join('')}</div>
  <div class="chips">${[['radar','Radar'],['bars','Detalle'],['trend','Tendencia']].map(([id,l])=>`<button class="chip ${tab===id?'on':''}" data-tab="${id}">${l}</button>`).join('')}</div>
  <div class="panel">${panel}</div>
  <div class="lbl" style="margin-top:0">Todos los eventos</div>
  ${[...events].map((x,i)=>[x,i]).reverse().map(([x,i])=>{const s=scores(x);return`<div class="item ${i===sel?'on':''}" data-item="${i}">
    <div class="top"><div class="circ" style="color:${col(s.global)}">${s.global>0?s.global.toFixed(1):'—'}</div>
    <div class="t"><b>${esc(name(x))}</b><small>${esc([x.info.venue,x.info.ciudad,x.date].filter(Boolean).join(' · '))}</small></div>
    <div class="mini">${CATS.map(c=>`<i style="background:${s[c.id]>0?col(s[c.id]):'rgba(255,255,255,.07)'}"></i>`).join('')}</div></div>
    ${open===i?`<div class="det">${CATS.map(c=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:11px;color:#998f82;margin-bottom:4px"><span>${c.icon} ${c.full}</span><span style="color:${c.color}">${s[c.id]>0?s[c.id].toFixed(1)+' ★':'—'}</span></div><div class="bar"><i style="width:${s[c.id]/5*100}%;background:${c.color}"></i></div>${x.notas&&x.notas[c.id]?`<div class="note">${esc(x.notas[c.id])}</div>`:''}</div>`).join('')}
    ${x.generalNota?`<div class="note" style="font-size:12px;margin:10px 0">"${esc(x.generalNota)}"</div>`:''}<button class="del" data-del="${i}">Eliminar evento</button></div>`:''}</div>`}).join('')}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px">
    <button class="btn g" id="csv">↓ CSV (para Sheets)</button><button class="btn g" id="exp">↓ Respaldo JSON</button><button class="btn g" id="imp">↑ Importar JSON</button></div>`;
}
const head=(e,sc)=>`<div style="text-align:center;margin-bottom:12px"><div style="font-size:15px;font-weight:700;color:#fff">${esc(name(e))}</div><div style="font-size:11px;color:#555;margin-top:2px">${esc([e.info.fecha,e.info.venue,e.info.ciudad].filter(Boolean).join(' · '))}</div><div class="pill"><b style="color:${col(sc.global)}">${sc.global.toFixed(1)}</b> — ${lab(sc.global)}</div></div>`;

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const h=['Fecha Guardado','Artista','Evento','Fecha Evento','Venue','Ciudad','Score Global','Producción','Venue & Logística','Experiencia','Dirección Artística','Notas Generales'];
  const rows=events.map(e=>{const s=scores(e);return[e.date,e.info.artista,e.info.nombre,e.info.fecha,e.info.venue,e.info.ciudad,s.global.toFixed(2),s.produccion.toFixed(2),s.venue.toFixed(2),s.experiencia.toFixed(2),s.arte.toFixed(2),e.generalNota].map(q).join(',')});
  dl('music-event-scorecard.csv','﻿'+[h.map(q).join(','),...rows].join('\n'),'text/csv');
}
function importJson(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const have=new Set(all.map(x=>x.id));let k=0;d.forEach(x=>{if(!x||typeof x!=='object'||!x.info||!x.ratings)return;if(x.id&&have.has(x.id))return;all.push({...x,id:x.id||uuid(),created:x.created||Date.now()+k++,_dirty:true})});commit();sel=Math.max(0,events.length-1);dash()}catch(_){alert('Archivo JSON inválido')}};r.readAsText(f)};
  i.click();
}

  if(c('[data-sel]')){sel=+c('[data-sel]').dataset.sel;return dash()}
  if(c('[data-tab]')){tab=c('[data-tab]').dataset.tab;return dash()}

const st=(t,c)=>{const n=$('#syncSt');n.textContent=t;n.className='sync'+(c?' '+c:'')};
async function sync(){
  if(!sb){st('Solo en este dispositivo');return}
  if(syncing){again=true;return}
  syncing=true;
  try{
    const{data:{session}}=await sb.auth.getSession();
    $('#loginBtn').hidden=!!session;

    st('Sincronizando…');
    const{data:rows,error}=await sb.from('scorecard_events').select('id,data,updated_at,deleted_at').order('updated_at',{ascending:true});
    if(error)throw error;
    for(const r of rows){
      const i=all.findIndex(x=>x.id===r.id);

      else if(!all[i]._dirty&&all[i]._rev!==r.updated_at)all[i]=fromRow(r); // lo local sin guardar gana y se sube abajo

      if(er)throw er;
      e._rev=o.updated_at;e._dirty=false;
    }
    persist();refresh();sel=Math.min(sel,Math.max(0,events.length-1));
    if(cur==='form'&&!touched&&events.length)show('dash');else if(cur==='dash')dash();

  }finally{
    syncing=false;
    if(again){again=false;sync()}
  }
}
